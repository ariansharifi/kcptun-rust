#!/bin/sh

# PROVIDE: kcptun
# REQUIRE: NETWORKING
# KEYWORD: shutdown

# FreeBSD startup script, rename and put this file to
#   /usr/local/etc/rc.d/kcptun
# and, run:
#   chmod +x /usr/local/etc/rc.d/kcptun
#   echo kcptun_enable="YES" >> /etc/rc.conf
#   service kcptun start

# Port of kcptun/dist/freebsd/kcptun-server.rc.conf (Go, commit 39935d5307f0). Unchanged except
# for the two paths in command_args: the binary is kcptun-server (DECISIONS D18) instead of the
# release archive's Go-style server_freebsd_amd64, and the configuration file is server.json.
# Release archives ship server_freebsd_amd64 as an alias, so the upstream line keeps working.
# As upstream, this one runs as root (no -u): the server side is the one that usually needs
# privileged ports and, with -tcp, raw sockets.

. /etc/rc.subr

name="kcptun" # How the service will be invoked from service
desc="kcptun daemon" # the description
rcvar="kcptun_enable" # The variable in rc.conf that will allow this service to run
load_rc_config $name # Loads the config file, if relevant.
: ${kcptun_enable:="NO"}

dir="/usr/local/bin"   # change this to the directory where kcptun binaries are.
command="/usr/sbin/daemon"
pidfile="/var/run/${name}.pid"
command_args="-c -f -S -P ${pidfile} -r $dir/kcptun-server -c /usr/local/etc/kcptun/server.json"

run_rc_command "$1"
