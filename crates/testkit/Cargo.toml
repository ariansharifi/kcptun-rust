[package]
name = "kcptun-testkit"
description = "Test utilities for kcptun-rust (not published)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Must never depend on other kcptun crates: they dev-depend on this one, and a dependency
# back would give them two copies of their own types.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
socket2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }

# `getrusage(2)` for the CPU accounting of `cpu` (benchmark harnesses only).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
